<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dos Azodnem Kupalino</title>
    <link rel="icon" type="image/png" href="Azodnem.png"/>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=Cinzel:wght@700&family=Permanent+Marker&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: #050505;
            color: #ffffff;
            font-family: 'Courier Prime', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .video-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        .bg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(0, 0, 0, 0.85), rgba(0, 0, 0, 0.90));
            z-index: 2;
        }

        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.3) 50%
            ), linear-gradient(
                90deg,
                rgba(255, 0, 0, 0.03),
                rgba(0, 255, 0, 0.01),
                rgba(0, 0, 255, 0.03)
            );
            background-size: 100% 4px, 6px 100%;
            z-index: 3;
            pointer-events: none;
        }

        .intro-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .intro-logo {
            font-family: 'Permanent Marker', cursive;
            font-size: 5.5rem;
            font-style: italic;
            letter-spacing: -2px;
            background: linear-gradient(135deg, #e60000 0%, #ff3333 55%, #ffffff 56%, #ffffff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(230, 0, 0, 0.4));
            margin-bottom: 25px;
            transform: skewX(-6deg);
        }

        .intro-subtitle {
            font-size: 0.95rem;
            letter-spacing: 4px;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 35px;
        }

        .proceed-btn {
            background: transparent;
            border: 1px solid #ffffff;
            color: #ffffff;
            padding: 12px 36px;
            font-family: 'Courier Prime', monospace;
            font-size: 0.85rem;
            letter-spacing: 3px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 35px;
        }

        .proceed-btn:hover {
            background-color: #ffffff;
            color: #000000;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }

        .intro-footer {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 2px;
            font-style: italic;
        }

        .intro-overlay.fade-out {
            opacity: 0;
            pointer-events: none;
            transform: scale(1.05);
        }

        .container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 480px;
            background: rgba(15, 15, 15, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 16px;
            padding: 0 0 25px 0;
            text-align: left;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: neonPulse 4s infinite alternate;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 1s ease 0.3s, transform 1s ease 0.3s;
            overflow: hidden;
        }

        .container.reveal {
            opacity: 1;
            transform: translateY(0);
        }

        @keyframes neonPulse {
            0% {
                box-shadow: 0 0 25px rgba(255, 255, 255, 0.02), 0 0 2px rgba(255, 255, 255, 0.08);
                border-color: rgba(255, 255, 255, 0.06);
            }
            100% {
                box-shadow: 0 0 35px rgba(255, 255, 255, 0.1), 0 0 8px rgba(255, 255, 255, 0.15);
                border-color: rgba(255, 255, 255, 0.2);
            }
        }

        .banner-box {
            width: 100%;
            height: 140px;
            position: relative;
            background: linear-gradient(45deg, #0f0f0f, #222);
            background-size: cover;
            background-position: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .banner-overlay-text {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            font-family: 'Cinzel', serif;
            font-size: 2.5rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.15);
            display: flex;
            justify-content: center;
            align-items: center;
            letter-spacing: 12px;
            background: rgba(0, 0, 0, 0.2);
            pointer-events: none;
        }

        .avatar-wrapper {
            position: relative;
            margin-top: -55px;
            margin-left: 20px;
            margin-bottom: 15px;
            display: inline-block;
        }

        .avatar-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #111;
            border: 6px solid rgba(15, 15, 15, 1);
            object-fit: cover;
        }

        .status-badge {
            position: absolute;
            bottom: 4px;
            right: 4px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background-color: #747f8d; /* Default Offline */
            border: 5px solid rgba(15, 15, 15, 1);
            transition: background-color 0.3s ease;
        }

        .profile-body {
            padding: 0 24px;
        }

        .username-text {
            font-size: 1.4rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .custom-status {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 15px;
            text-align: center;
        }

        .ip-action-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .reveal-btn {
            background: rgba(230, 0, 0, 0.1);
            border: 1px solid #e60000;
            color: #ffffff;
            padding: 8px 20px;
            font-family: 'Courier Prime', monospace;
            font-size: 0.8rem;
            letter-spacing: 2px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .reveal-btn:hover {
            background-color: #e60000;
            box-shadow: 0 0 15px rgba(230, 0, 0, 0.6);
            text-shadow: 0 0 4px #fff;
        }

        .ip-display-box {
            display: none;
            width: 100%;
            margin-top: 12px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px dashed rgba(230, 0, 0, 0.4);
            border-radius: 6px;
            padding: 10px;
            font-size: 0.75rem;
            color: #ffcccc;
            line-height: 1.5;
        }

        .ip-display-box span {
            color: #ffffff;
            font-weight: bold;
        }

        .activity-section {
            display: none; 
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            padding: 14px;
            border: 1px solid rgba(255, 255, 255, 0.07);
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .activity-header {
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: bold;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 1.5px;
            margin-bottom: 10px;
        }

        .activity-content {
            display: flex;
            gap: 14px;
            align-items: center;
        }

        .activity-asset-wrapper {
            position: relative;
            width: 64px;
            height: 64px;
            flex-shrink: 0;
        }

        .activity-large-img {
            width: 64px;
            height: 64px;
            border-radius: 8px;
            object-fit: cover;
            background: #111;
        }

        .activity-small-img {
            position: absolute;
            bottom: -4px;
            right: -4px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid rgba(15, 15, 15, 1);
            object-fit: cover;
            background: #111;
        }

        .activity-details {
            flex-grow: 1;
            overflow: hidden;
        }

        .activity-name {
            font-size: 0.9rem;
            font-weight: 700;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 2px;
        }

        .activity-state, .activity-details-text {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.6);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .activity-section.spotify-active {
            border-color: rgba(29, 185, 84, 0.25);
            background: linear-gradient(135deg, rgba(29, 185, 84, 0.03) 0%, rgba(0, 0, 0, 0.4) 100%);
        }
        .activity-section.gaming-active {
            border-color: rgba(88, 101, 242, 0.25);
            background: linear-gradient(135deg, rgba(88, 101, 242, 0.03) 0%, rgba(0, 0, 0, 0.4) 100%);
        }

        .connections-section {
            margin-bottom: 20px;
        }

        .connections-header {
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: bold;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 1.5px;
            margin-bottom: 10px;
        }

        .connections-row {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .logo-only-link {
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            width: 44px;
            height: 44px;
            color: rgba(255, 255, 255, 0.6);
            transition: all 0.2s ease;
        }

        .logo-only-link svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        .logo-only-link.conn-yt:hover {
            background: rgba(255, 0, 0, 0.15);
            border-color: #ff0000;
            color: #ff0000;
            box-shadow: 0 0 12px rgba(255, 0, 0, 0.3);
        }

        .logo-only-link.conn-dc:hover {
            background: rgba(88, 101, 242, 0.15);
            border-color: #5865F2;
            color: #5865F2;
            box-shadow: 0 0 12px rgba(88, 101, 242, 0.3);
        }

        .clips-section {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 8px;
            padding: 16px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            margin-bottom: 20px;
        }

        .clips-header {
            font-size: 0.85rem;
            font-weight: bold;
            color: #ffffff;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .clip-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; 
            height: 0;
            overflow: hidden;
            border-radius: 6px;
            background: #000000;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .clip-link {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            overflow: hidden;
        }

        .clip-banner-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease, filter 0.4s ease;
        }

        .clip-link:hover .clip-banner-img {
            transform: scale(1.05);
            filter: brightness(1.1);
        }

        .footer-credits {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.25);
            letter-spacing: 3px;
            text-transform: uppercase;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <script>
        const enterBtn = document.getElementById('enter-btn');
        const gateScreen = document.getElementById('gate-screen');
        const mainUI = document.getElementById('main-ui');
        const videoBg = document.querySelector('.video-bg');
        const bgMusic = document.getElementById('bg-music');
        const revealNetBtn = document.getElementById('reveal-net-btn');
        const netDisplayBox = document.getElementById('net-display-box');

        const discordUserId = "1265093427662684272"; 

        async function fetchDiscordProfile() {
            try {
                const response = await fetch(`https://api.lanyard.rest/v1/users/${discordUserId}`);
                const resData = await response.json();
                
                if (resData.success && resData.data) {
                    const data = resData.data;
                    const user = data.discord_user;
                    const status = data.discord_status;

                    if (user.avatar) {
                        const isAnimated = user.avatar.startsWith('a_');
                        const avatarUrl = `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.${isAnimated ? 'gif' : 'png'}?size=256`;
                        document.getElementById('discord-avatar').src = avatarUrl;
                    }

                    if (user.banner) {
                        const isBannerAnimated = user.banner.startsWith('a_');
                        const bannerUrl = `https://cdn.discordapp.com/banners/${user.id}/${user.banner}.${isBannerAnimated ? 'gif' : 'png'}?size=600`;
                        document.getElementById('discord-banner').style.backgroundImage = `url('${bannerUrl}')`;
                    }

                    const statusBadge = document.getElementById('discord-status');
                    switch (status) {
                        case 'online': statusBadge.style.backgroundColor = '#43b581'; break;
                        case 'idle': statusBadge.style.backgroundColor = '#faa61a'; break;
                        case 'dnd': statusBadge.style.backgroundColor = '#f04747'; break;
                        case 'offline':
                        default: statusBadge.style.backgroundColor = '#747f8d'; break;
                    }

                    const activityBox = document.getElementById('activity-box');
                    activityBox.className = "activity-section"; 

                    if (data.listening_to_spotify && data.spotify) {
                        activityBox.style.display = "block";
                        activityBox.classList.add("spotify-active");
                        document.getElementById('activity-title').innerText = "LISTENING TO SPOTIFY";
                        
                        document.getElementById('activity-name').innerText = data.spotify.track;
                        document.getElementById('activity-details-text').innerText = `by ${data.spotify.artist}`;
                        document.getElementById('activity-state').innerText = `on ${data.spotify.album}`;
                        
                        const largeImg = document.getElementById('activity-large');
                        largeImg.src = data.spotify.album_art_url || '';
                        largeImg.style.borderRadius = "8px";
                        document.getElementById('activity-small').style.display = "none";

                    } else if (data.activities && data.activities.length > 0) {
                        const validActivity = data.activities.find(act => act.type !== 4);
                        
                        if (validActivity) {
                            activityBox.style.display = "block";
                            activityBox.classList.add("gaming-active");
                            
                            document.getElementById('activity-title').innerText = validActivity.type === 1 ? "STREAMING" : "PLAYING A GAME";
                            document.getElementById('activity-name').innerText = validActivity.name;
                            document.getElementById('activity-details-text').innerText = validActivity.details || '';
                            document.getElementById('activity-state').innerText = validActivity.state || '';
                            
                            const largeImg = document.getElementById('activity-large');
                            const smallImg = document.getElementById('activity-small');
                            
                            if (validActivity.assets && validActivity.assets.large_image) {
                                largeImg.style.display = "block";
                                if (validActivity.assets.large_image.startsWith("mp:external")) {
                                    largeImg.src = validActivity.assets.large_image.replace(/mp:external\/[^\/]+\/http/, "https");
                                } else {
                                    largeImg.src = `https://cdn.discordapp.com/app-assets/${validActivity.application_id}/${validActivity.assets.large_image}.png`;
                                }
                                
                                if (validActivity.assets.small_image) {
                                    smallImg.style.display = "block";
                                    if (validActivity.assets.small_image.startsWith("mp:external")) {
                                        smallImg.src = validActivity.assets.small_image.replace(/mp:external\/[^\/]+\/http/, "https");
                                    } else {
                                        smallImg.src = `https://cdn.discordapp.com/app-assets/${validActivity.application_id}/${validActivity.assets.small_image}.png`;
                                    }
                                } else {
                                    smallImg.style.display = "none";
                                }
                            } else {
                                largeImg.src = "https://cdn.discordapp.com/embed/avatars/0.png";
                                smallImg.style.display = "none";
                            }
                        } else {
                            activityBox.style.display = "none";
                        }
                    } else {
                        activityBox.style.display = "none";
                    }
                }
            } catch (error) {
                console.error("Lanyard execution error:", error);
            }
        }

        setInterval(fetchDiscordProfile, 8000);
        fetchDiscordProfile();

        revealNetBtn.addEventListener('click', async () => {
            netDisplayBox.style.display = "block";
            netDisplayBox.innerHTML = "Establishing handshake... Fetching matrix...";
            
            try {
                const response = await fetch('https://ipapi.co/json/');
                const data = await response.json();
                
                if(data && data.ip) {
                    netDisplayBox.innerHTML = `
                        &gt; IP ADDRESS: <span>${data.ip}</span><br>
                        &gt; LOCATION: <span>${data.city}, ${data.region}, ${data.country_name}</span><br>
                        &gt; PROVIDER: <span>${data.org}</span><br>
                        &gt; TIMEZONE: <span>${data.timezone}</span><br>
                        &gt; COORDINATES: <span>${data.latitude}, ${data.longitude}</span>
                    `;
                } else {
                    netDisplayBox.innerHTML = "Handshake failed. Proxy/Firewall detected.";
                }
            } catch (error) {
                netDisplayBox.innerHTML = "Execution error. Data stream severed.";
                console.error("IP leak error:", error);
            }
        });

        enterBtn.addEventListener('click', () => {
            gateScreen.classList.add('fade-out');
            mainUI.classList.add('reveal');
            
            const docEl = document.documentElement;
            if (docEl.requestFullscreen) {
                docEl.requestFullscreen();
            } else if (docEl.webkitRequestFullscreen) {
                docEl.webkitRequestFullscreen();
            } else if (docEl.msRequestFullscreen) {
                docEl.msRequestFullscreen();
            }

            if (bgMusic) {
                bgMusic.volume = 0.60;
                bgMusic.play().catch(err => console.log("Audio play blocked."));
            }

            if (videoBg) {
                videoBg.play().catch(err => console.log("Video playback initialized."));
            }
        });

        document.addEventListener('contextmenu', (e) => e.preventDefault());
        document.addEventListener('keydown', (e) => {
            if (e.key === 'F12') { e.preventDefault(); return false; }
            if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C' || e.key === 'i' || e.key === 'j' || e.key === 'c')) {
                e.preventDefault(); return false;
            }
            if (e.ctrlKey && (e.key === 'U' || e.key === 'u')) { e.preventDefault(); return false; }
        });
    </script>
</body>
</html>
