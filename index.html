<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/x-icon" href="Azodnem.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">

    <meta property="og:title" content="DosWak">
    <meta property="og:description" content="DosWak Profile">
    <meta property="og:image" content="https://doswak.site/img/banner.gif">
    <meta property="og:url" content="https://doswak.site/doswak">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">

    <style>
        .social-bar {
            display: flex;
            justify-content: center;
            gap: 16px;
            padding: 10px 18px;
            border-radius: 999px;
            background: rgb(255, 255, 255);
            backdrop-filter: blur(18px);
            border: 1px solid rgba(0, 0, 0, 0.39);
            width: fit-content;
            max-width: 260px;
            margin: 20px auto;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .social-bar a {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.25s ease;
        }

        .social-bar a:hover {
            transform: scale(1.15);
            background: rgb(255, 255, 255);
        }

        .social-bar a:hover {
            background: rgb(255, 255, 255);
            transform: translateY(-3px);
        }

        .social-bar a:hover img {
            opacity: 1;
        }

        body {
            margin: 0;
            overflow: hidden;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            background-image: url('banner.gif');
            font-family: 'Outfit', sans-serif;
            color: #fff;
        }

        #bg-glow {
            position: fixed;
            inset: 0;
            z-index: -3;
            opacity: 0.4;
            filter: blur(80px);
            transition: opacity 2s ease;
            background:
                radial-gradient(circle at 20% 30%, var(--c1, transparent) 0%, transparent 70%),
                radial-gradient(circle at 80% 70%, var(--c2, transparent) 0%, transparent 70%),
                radial-gradient(circle at 50% 50%, var(--c3, transparent) 0%, transparent 80%);
            transition: 2s ease-in-out;
        }

        canvas {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
        }

        #web-trails {
            z-index: -2;
        }

        #profile {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: min(90vw, 380px);
            padding: 30px 20px;
            text-align: center;
            backdrop-filter: blur(10px);
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(0, 0, 0, 0.356);
            border-radius: 24px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.6);
            box-sizing: border-box;
        }

        .avatar-container {
            position: relative;
            width: 128px;
            height: 128px;
            margin: 0 auto 16px;
        }

        .avatar {
            width: 128px;
            height: 128px;
            border-radius: 50%;
            object-fit: cover;
        }

        .status-dot {
            position: absolute;
            bottom: -4px;
            right: -4px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 4px solid #000;
            z-index: 3;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 12px;
        }

        .link-btn {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            border: none;
            padding: 14px 20px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .link-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        .visitor-count {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 15px auto 0 auto;
            background: rgba(255, 255, 255, 0.06);
            padding: 10px 14px;
            border-radius: 16px;
            width: fit-content;
            transition: all 0.2s;
        }

        .visitor-count:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        .visitor-count img {
            border-radius: 4px;
        }

        #visitor-text {
            font-family: Arial, sans-serif;
            font-size: 13px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.55);
            letter-spacing: 0.3px;
        }

        #visitor-num {
            color: rgba(255, 255, 255, 0.55);
            font-weight: 700;
        }

        .loading-dots {
            animation: pulse 1.5s infinite;
            opacity: 0.6;
        }

        .loading-dots::after {
            content: '';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {

            0%,
            20% {
                content: '';
            }

            40% {
                content: '.';
            }

            60% {
                content: '..';
            }

            80% {
                content: '...';
            }

            100% {
                content: '';
            }
        }

        @keyframes pulse {
            0% {
                opacity: 0.2;
            }

            50% {
                opacity: 0.8;
            }

            100% {
                opacity: 0.2;
            }
        }

        .volume-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
            color: rgba(255, 255, 255, 0.55);
            font-size: 14px;
        }

        #volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 120px;
            height: 4px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 2px;
            outline: none;
        }

        #volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            transition: transform 0.2s;
        }

        #volume-slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        #enter-screen {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.5s ease;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.55);
            font-family: 'Outfit', sans-serif;
        }

        #display-name {
            font-weight: 800;
            font-size: 42px;
            margin: 0;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
            letter-spacing: -1px;
        }

        .username {
            font-size: 16px;
            opacity: 0.5;
            margin-top: 4px;
            letter-spacing: 1px;
        }

        .avatar-deco {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 154px;
            height: 154px;
            pointer-events: none;
            z-index: 2;
        }

        .bio-container {
            margin-top: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            animation: reveal-item 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.35s both;
        }

        .bio-text {
            margin: 0;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.55);
            font-style: italic;
            letter-spacing: 0.5px;
            min-height: 20px;
            text-align: center;
        }

        .bio-text::after {
            content: '|';
            animation: blink 1s step-end infinite;
            margin-left: 2px;
            opacity: 0;
        }

        .bio-text.typing::after {
            opacity: 1;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0;
            }
        }

        .local-time {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 10px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-top: 4px;
        }

        #profile {
            animation: reveal-profile 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards, float-profile 6s ease-in-out 1.2s infinite;
        }

        @keyframes float-profile {

            0%,
            100% {
                transform: translate(-50%, -50%);
            }

            50% {
                transform: translate(-50%, -52%);
            }
        }

        .avatar-container {
            animation: reveal-item 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both;
        }

        #display-name {
            animation: reveal-item 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both;
        }

        #username {
            animation: reveal-item 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.3s both;
        }

        .activity {
            animation: reveal-item 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.4s both;
        }

        .social-bar {
            animation: reveal-item 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.5s both;
        }

        .visitor-count {
            animation: reveal-item 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.6s both;
        }

        @keyframes reveal-profile {
            0% {
                opacity: 0;
                transform: translate(-50%, -45%) scale(0.98);
                filter: blur(10px);
            }

            100% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
                filter: blur(0);
            }
        }

        @keyframes reveal-item {
            0% {
                opacity: 0;
                transform: translateY(10px);
                filter: blur(5px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }

        .activity {
            margin-top: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            width: 100%;
        }

        .spotify-wrapper {
            perspective: 2000px;
            position: fixed;
            top: 50%;
            left: calc(50% + clamp(180px, 15vw + 80px, 300px));
            transform: translateY(-50%);
            z-index: 100;
            animation: floatCard 6s ease-in-out infinite;
        }

        .spotify-card {
            width: clamp(240px, 20vw, 340px);
            height: 520px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
        }

        .spotify-card.flipped {
            transform: rotateY(180deg);
        }

        .spotify-card-front,
        .spotify-card-back {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            background: rgba(18, 18, 18, 0.6);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(0, 0, 0, 0.548);
            border-radius: 16px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.8);
            overflow: hidden;
        }

        .spotify-card-back {
            transform: rotateY(180deg);
            background: rgba(15, 15, 15, 1);
            justify-content: flex-start;
            gap: 15px;
        }

        .spotify-card:hover:not(.flipped) {
            transform: rotateY(-10deg) rotateX(5deg) scale(1.02);
        }

        .spotify-card.flipped:hover {
            transform: rotateY(190deg) rotateX(5deg) scale(1.02);
        }

        .activity {
            margin-top: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            width: 100%;
        }

        .discord-wrapper {
            position: fixed;
            top: 50%;
            left: calc(50% - 700px);
            transform: translateY(-50%);
            z-index: 100;
            animation: floatCard 6s ease-in-out infinite;
        }

        .discord-card {
            width: clamp(240px, 20vw, 340px);
            height: 565px;
            background: rgba(0, 0, 0, 0.541);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            border: 1px solid rgb(0, 0, 0);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.315);
            padding: 210px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transform: rotateY(-12deg) rotateX(2deg);
            transition: transform 0.4s ease, opacity 0.5s ease, visibility 0.5s ease;
            box-sizing: border-box;
            aspect-ratio: unset;
        }

        .discord-card {
            margin-top: 40px;
        }

        .discord-card:hover {
            transform: scale(1.03) rotateY(5deg);
        }

        .discord-inner {
            text-align: center;
        }

        .discord-top-text {
            font-size: 11px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 16px;
        }

        .discord-servers {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .discord-server {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            object-fit: cover;
            transition: 0.25s;
        }

        .discord-server:hover {
            transform: scale(1.15);
        }

        .discord-card:hover:not(.flipped) {
            transform: rotateY(12deg) rotateX(5deg) scale(1.02);
            transition: transform 0.4s ease;
        }

        .discord-card.flipped:hover {
            transform: rotateY(190deg) rotateX(5deg) scale(1.02);
        }

        .discord-card:hover {
            transform: rotateY(-6deg) rotateX(2deg) scale(1.05);
        }

        .discord-status {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
        }

        .activity {
            align-items: center;
        }

        .other-activity {
            width: 90%;
            max-width: 340px;
            margin-left: auto;
            margin-right: auto;
        }

        #profile {
            animation: reveal-profile 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards, float-profile 6s ease-in-out 1.2s infinite;
        }

        @keyframes floatCard {

            0%,
            100% {
                transform: translateY(-50%);
            }

            50% {
                transform: translateY(calc(-50% - 12px));
            }
        }

        @media (max-width: 900px) {
            body {
                overflow: hidden;
            }

            #profile {
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                width: 92vw;
                max-width: 360px;
                text-align: center;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 0;
                animation: reveal-profile 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            }

            .avatar-container {
                width: 72px;
                height: 72px;
                margin-bottom: 8px;
            }

            .avatar {
                width: 72px;
                height: 72px;
            }

            .avatar-deco {
                width: 86px;
                height: 86px;
            }

            .status-dot {
                width: 16px;
                height: 16px;
                border-width: 3px;
            }

            #display-name {
                font-size: 26px;
                margin: 0;
            }

            .username {
                font-size: 12px;
                margin-top: 2px;
            }

            .bio-container {
                margin-top: 6px;
                gap: 4px;
            }

            .bio-text {
                font-size: 11px;
            }

            .local-time {
                font-size: 10px;
                padding: 2px 8px;
                margin-top: 0;
            }

            .activity {
                margin-top: 8px;
                width: 100%;
                align-items: center;
                display: flex;
                flex-direction: column;
                gap: 6px;
            }

            .spotify-wrapper {
                width: 100%;
                max-width: 100%;
                margin: 0;
            }

            .spotify-card {
                position: relative;
                width: 100%;
                height: 28vh;
                aspect-ratio: unset;
                transform: none !important;
                overflow: hidden;
                border-radius: 14px;
            }

            .spotify-card-front,
            .spotify-card-back {
                padding: 10px 14px;
            }

            .spotify-art-large {
                max-height: 12vh;
                width: auto;
                margin: 0 auto 8px;
                border-radius: 6px;
            }

            .spotify-song-large {
                font-size: 13px;
            }

            .spotify-artist-large {
                font-size: 10px;
            }

            .spotify-top-text {
                font-size: 8px;
                margin-bottom: 6px;
            }

            .spotify-time {
                font-size: 8px;
                margin-bottom: 6px;
            }

            .spotify-volume {
                display: none;
            }

            .other-activity {
                width: 100%;
                max-width: 100%;
                margin: 0;
                padding: 8px 12px;
                font-size: 12px;
                box-sizing: border-box;
            }

            .other-activity strong {
                font-size: 12px;
            }

            .other-activity small {
                font-size: 10px;
            }

            .activity-icon {
                width: 36px;
                height: 36px;
                border-radius: 8px;
            }

            .social-bar {
                display: inline-flex;
                margin: 8px auto 0;
                padding: 6px 10px;
                gap: 12px;
                justify-content: center;
            }

            .social-bar a {
                width: 34px;
                height: 34px;
            }

            .social-bar a img {
                width: 18px;
                height: 18px;
            }

            .visitor-count {
                margin: 6px auto 0;
                padding: 6px 10px;
            }

            #visitor-text {
                font-size: 11px;
            }
        }

        .spotify-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--spotify-bg, #000000);
            background-image: var(--spotify-art);
            background-size: cover;
            background-position: center;
            filter: blur(30px) brightness(0.4);
            z-index: 0;
            opacity: 0.8;
        }

        .spotify-inner {
            position: relative;
            z-index: 1;
        }

        .spotify-top-text {
            font-size: 11px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.55);
            margin-bottom: 12px;
            display: block;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .spotify-art-large {
            width: 100%;
            aspect-ratio: 1/1;
            border-radius: 8px;
            object-fit: cover;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            margin-bottom: 16px;
            display: block;
        }

        .spotify-meta {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        .spotify-info-large {
            min-width: 0;
        }

        .spotify-song-large {
            font-size: 18px;
            font-weight: 800;
            color: #fff;
            margin: 0;
            display: block;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            letter-spacing: -0.3px;
        }

        .spotify-artist-large {
            font-size: 13px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.55);
            margin: 2px 0 0 0;
            display: block;
        }

        .spotify-icons {
            display: flex;
            gap: 10px;
        }

        .spotify-icon-btn {
            width: 20px;
            height: 20px;
            opacity: 0.6;
            filter: invert(1);
        }

        .spotify-progress-container {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            margin-bottom: 6px;
        }

        .spotify-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #fff, #1db954);
            box-shadow: 0 0 10px rgba(29, 185, 84, 0.5);
            border-radius: 2px;
            width: 0%;
            transition: width 1s linear;
        }

        .spotify-time {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.55);
            font-weight: 600;
            margin-bottom: 12px;
        }

        .spotify-volume {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .spotify-volume-slider {
            -webkit-appearance: none;
            appearance: none;
            flex: 1;
            height: 4px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 2px;
            outline: none;
        }

        .spotify-volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
            transition: all 0.2s;
        }

        .spotify-volume-slider::-webkit-slider-thumb:hover {
            transform: scale(1.4);
            box-shadow: 0 0 12px #fff;
        }

        .visualizer {
            display: flex;
            align-items: flex-end;
            gap: 2px;
            height: 14px;
        }

        .visualizer .bar {
            width: 3px;
            background: #1db954;
            border-radius: 1px;
            animation: equalize 0.8s ease-in-out infinite;
        }

        .visualizer .bar:nth-child(1) {
            height: 60%;
            animation-delay: 0.1s;
        }

        .visualizer .bar:nth-child(2) {
            height: 100%;
            animation-delay: 0.3s;
        }

        .visualizer .bar:nth-child(3) {
            height: 80%;
            animation-delay: 0.2s;
        }

        .visualizer .bar:nth-child(4) {
            height: 40%;
            animation-delay: 0.4s;
        }

        @keyframes equalize {

            0%,
            100% {
                transform: scaleY(0.4);
            }

            50% {
                transform: scaleY(1);
            }
        }

        .spotify-volume-slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .other-activity {
            background: rgba(255, 255, 255, 0.06);

                  <div style="margin-top: 16px;">
                    <strong style="display: block; font-size: 14px; color: #1db954; margin-bottom: 4px;">Album</strong>
                    <p style="font-size: 13px; color: rgba(255, 255, 255, 0.55); margin: 0;">${d.spotify.album}</p>
                  </div>
                  <div style="margin-top: 16px; flex-grow: 1;">
                    <strong style="display: block; font-size: 14px; color: #1db954; margin-bottom: 4px;">Credits</strong>
                    <p style="font-size: 12px; color: rgba(255, 255, 255, 0.55); margin: 0; line-height: 1.5;">
                      This track is part of the album "${d.spotify.album}" by ${formattedArtist}. 
                      Released on Spotify.
                    </p>
                  </div>
                  <div class="spotify-volume" onclick="event.stopPropagation();" style="margin-top: 10px;">
                    <input type="range" class="spotify-volume-slider" min="0" max="1" step="0.01" value="${document.getElementById('bg-audio').volume}">
                  </div>
                  <a href="https://open.spotify.com/track/${d.spotify.track_id}" target="_blank" 
                     onclick="event.stopPropagation();"
                     style="display: block; background: #1db954; color: #000; text-align: center; padding: 12px; border-radius: 16px; font-weight: 700; text-decoration: none; font-size: 13px; margin-top: 10px; transition: 0.2s;">
                     Open on Spotify
                  </a>
                </div>
              </div>
          `;
                document.getElementById('spotify-wrapper').innerHTML = spotifyCardHtml;
                document.getElementById('spotify-wrapper').style.visibility = 'visible';
                document.getElementById('spotify-wrapper').style.opacity = '1';
                if (window.currentSpotifySong !== d.spotify.track_id) {
                    window.currentSpotifySong = d.spotify.track_id;
                    const audio = document.getElementById('bg-audio');
                    const cleanSearchTitle = d.spotify.song.split('(')[0].split('-')[0].trim();
                    const primaryArtistSearch = formattedArtist.split(',')[0].trim();
                    const normalize = str => (str || "").toLowerCase().replace(/[^a-z0-9]/g, '');
                    const normSong = normalize(d.spotify.song);
                    const normArtist = normalize(primaryArtistSearch);
                    const tryDeezer = (query) => new Promise((resolve) => {
                        const cbName = 'dz_' + Date.now();
                        const script = document.createElement('script');
                        const timeout = setTimeout(() => {
                            delete window[cbName];
                            script.remove();
                            resolve(false);
                        }, 6000);
                        window[cbName] = (data) => {
                            clearTimeout(timeout);
                            delete window[cbName];
                            script.remove();
                            let results = (data.data || []).filter(r => r.preview);
                            let match = results.find(r => {
                                const normTrack = normalize(r.title);
                                const normRArtist = normalize(r.artist.name);
                                return (normTrack.includes(normSong) || normSong.includes(normTrack)) &&
                                    (normRArtist.includes(normArtist) || normArtist.includes(normRArtist));
                            });
                            if (!match) match = results.find(r => {
                                const normTrack = normalize(r.title);
                                return normTrack.includes(normSong) || normSong.includes(normTrack);
                            });
                            if (match) { audio.src = match.preview; resolve(true); }
                            else resolve(false);
                        };
                        script.src = `https://api.deezer.com/search?q=${encodeURIComponent(query)}&limit=20&output=jsonp&callback=${cbName}`;
                        document.head.appendChild(script);
                    });
                    fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(cleanSearchTitle + " " + primaryArtistSearch)}&entity=song&limit=15`)
                        .then(res => res.json())
                        .then(data => {
                            let foundMatch = false;
                            if (data.results && data.results.length > 0) {
                                const match = data.results.find(r => {
                                    if (!r.previewUrl) return false;
                                    const normTrack = normalize(r.trackName);
                                    const normRArtist = normalize(r.artistName);
                                    return (normTrack.includes(normSong) || normSong.includes(normTrack)) &&
                                        (normRArtist.includes(normArtist) || normArtist.includes(normRArtist));
                                });
                                if (match) {
                                    audio.src = match.previewUrl;
                                    foundMatch = true;
                                }

                            }
                            if (foundMatch) {
                                if (window.hasEntered) audio.play().catch(e => console.log("Audio play failed"));
                            } else {
                                tryDeezer(cleanSearchTitle + " " + primaryArtistSearch).then(deezerFound => {
                                    if (!deezerFound) audio.src = "Thehelly.mp3";
                                    if (window.hasEntered) audio.play().catch(e => console.log("Audio play failed"));
                                }).catch(() => {
                                    audio.src = "Thehelly.mp3";
                                    if (window.hasEntered) audio.play().catch(e => console.log("Audio play failed"));
                                });
                            }


                        })
                        .catch(e => {
                            tryDeezer(cleanSearchTitle + " " + primaryArtistSearch).then(deezerFound => {
                                if (!deezerFound) audio.src = "Thehelly.mp3";
                                if (window.hasEntered) audio.play().catch(e => console.log("Audio play failed"));
                            }).catch(() => {
                                audio.src = "Thehelly.mp3";
                                if (window.hasEntered) audio.play().catch(e => console.log("Audio play failed"));
                            });
                        });
                }
                const audio = document.getElementById('bg-audio');
                if (window.hasEntered && audio.paused) {
                    audio.play().catch(() => { });
                }
            } else {
                if (window.currentSpotifySong !== null) {
                    window.currentSpotifySong = null;
                    const audio = document.getElementById('bg-audio');
                    audio.src = "Thehelly.mp3";
                    if (window.hasEntered) audio.play().catch(e => console.log("Audio play failed"));
                } else {
                    const audio = document.getElementById('bg-audio');
                    if (window.hasEntered && audio.paused) audio.play().catch(() => { });
                }
                const fallbackArt = 'musiclogo.jpg';
                const fallbackSong = 'THE HELLY WHAT';
                const fallbackArtist = ' SCOOPDOG';
                const fallbackAlbum = '(Official Music Video)';
                const flipClass = window.isSpotifyFlipped ? 'flipped' : '';
                if (window.lastArtUrl !== fallbackArt) {
                    window.lastArtUrl = fallbackArt;
                    updateBackgroundColors(fallbackArt);
                }
                const audioEl = document.getElementById('bg-audio');
                const duration = audioEl.duration || 0;
                const current = audioEl.currentTime || 0;
                const progress = duration > 0 ? (current / duration) * 100 : 0;
                const formatSecs = (s) => {
                    if (isNaN(s)) return "0:00";
                    const min = Math.floor(s / 60);
                    const sec = Math.floor(s % 60).toString().padStart(2, '0');
                    return `${min}:${sec}`;
                };
                const fallbackCardHtml = `
              <div class="spotify-card ${flipClass}" onclick="window.isSpotifyFlipped = !window.isSpotifyFlipped; this.classList.toggle('flipped')" style="--spotify-art: url('${fallbackArt}')">
                <div class="spotify-card-front">
                  <div class="spotify-inner">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                      <span class="spotify-top-text" style="margin: 0;">Listening to Music</span>
                      <div class="visualizer">
                        <div class="bar"></div>
                        <div class="bar"></div>
                        <div class="bar"></div>
                        <div class="bar"></div>
                      </div>
                    </div>
                    <img class="spotify-art-large" src="${fallbackArt}" alt="Album Art" style="object-position: center; object-fit: cover;">
                    <div class="spotify-meta">
                      <div class="spotify-info-large">
                        <span class="spotify-song-large">${fallbackSong}</span>
                        <span class="spotify-artist-large">${fallbackArtist}</span>
                      </div>
                    </div>
                    <div class="spotify-progress-container">
                      <div class="spotify-progress-bar" style="width: ${progress}%"></div>
                    </div>
                    <div class="spotify-time">
                      <span>${formatSecs(current)}</span>
                      <span>${formatSecs(duration)}</span>
                    </div>
                    <div class="spotify-volume" onclick="event.stopPropagation();">
                      <input type="range" class="spotify-volume-slider" min="0" max="1" step="0.01" value="${audioEl.volume}">
                    </div>
                  </div>
                </div>
                <div class="spotify-card-back">
                  <span class="spotify-top-text">Track Info & Credits</span>
                  <div style="margin-top: 10px;">
                    <strong style="display: block; font-size: 14px; color: #1db954; margin-bottom: 4px;">Artists</strong>
                    <p style="font-size: 13px; color: rgba(255, 255, 255, 0.55); margin: 0; line-height: 1.4;">${fallbackArtist}</p>
                  </div>
                  <div style="margin-top: 16px;">
                    <strong style="display: block; font-size: 14px; color: #1db954; margin-bottom: 4px;">Album</strong>
                    <p style="font-size: 13px; color: rgba(255, 255, 255, 0.55); margin: 0;">${fallbackAlbum}</p>
                  </div>
                  <div style="margin-top: 16px; flex-grow: 1;">
                    <strong style="display: block; font-size: 14px; color: #1db954; margin-bottom: 4px;">Credits</strong>
                    <p style="font-size: 12px; color: rgba(255, 255, 255, 0.55); margin: 0; line-height: 1.5;">
                      This track is currently playing as the background music.
                    </p>
                  </div>
                  <div class="spotify-volume" onclick="event.stopPropagation();" style="margin-top: 10px;">
                    <input type="range" class="spotify-volume-slider" min="0" max="1" step="0.01" value="${audioEl.volume}">
                  </div>
                  <a href="https://youtu.be/zXgyDKGbscE?si=BPJRPX0qgB-Hwvso" target="_blank" 
                     onclick="event.stopPropagation();"
                     style="display: block; background: #ff0000; color: #fff; text-align: center; padding: 12px; border-radius: 16px; font-weight: 700; text-decoration: none; font-size: 13px; margin-top: 10px; transition: 0.2s;">
                     Open on YouTube
                  </a>
                </div>
              </div>
          `;
                document.getElementById('spotify-wrapper').innerHTML = fallbackCardHtml;
                document.getElementById('spotify-wrapper').style.visibility = 'visible';
                document.getElementById('spotify-wrapper').style.opacity = '1';
            }
            if (d.activities && d.activities.length > 0) {
                d.activities.forEach(act => {
                    if (act.id === 'spotify' || act.name === 'Spotify') return;
                    let iconHtml = "";
                    let imageUrl = "";
                    let assetId = act.assets ? (act.assets.large_image || act.assets.small_image) : null;
                    if (act.type === 4 && act.emoji) {
                        if (act.emoji.id) {
                            imageUrl = `https://cdn.discordapp.com/emojis/${act.emoji.id}.${act.emoji.animated ? 'gif' : 'png'}`;
                        }
                    } else if (assetId) {
                        if (assetId.startsWith("mp:external/")) {
                            imageUrl = `https://media.discordapp.net/external/${assetId.split("mp:external/")[1]}`;
                        } else if (assetId.startsWith("spotify:")) {
                            imageUrl = `https://i.scdn.co/image/${assetId.split("spotify:")[1]}`;
                        } else {
                            imageUrl = `https://cdn.discordapp.com/app-assets/${act.application_id}/${assetId}.png`;
                        }
                    } else if (act.application_id) {
                        imageUrl = `https://dcdn.dstn.to/app-icons/${act.application_id}.png`;
                    } else {
                        const name = act.name.toLowerCase();
                        if (name.includes("roblox")) imageUrl = "";
                        else if (name.includes("league")) imageUrl = "";
                        else if (name.includes("valorant")) imageUrl = "";
                        else if (name.includes("minecraft")) imageUrl = "";
                        else if (act.type === 1) imageUrl = "";
                    }
                    if (imageUrl) {
                        let isWhiteIcon = imageUrl.includes("simple-icons") || imageUrl.includes("discord.svg");
                        iconHtml = `<img src="${imageUrl}" class="activity-icon" style="${isWhiteIcon ? 'filter: invert(1);' : ''}" onerror="this.style.display='none'">`;
                    } else {
                        iconHtml = `<div class="activity-icon" style="background: rgba(255, 255, 255, 0.06); display: flex; align-items: center; justify-content: center;"><img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/discord.svg" style="width: 24px; filter: invert(1); opacity: 0.3;"></div>`;
                    }
                    let timeHtml = "";
                    if (act.timestamps && act.timestamps.start) {
                        const start = act.timestamps.start;
                        const now = Date.now();
                        const elapsed = Math.floor((now - start) / 1000);
                        if (elapsed >= 0) {
                            const hrs = Math.floor(elapsed / 3600);
                            const mins = Math.floor((elapsed % 3600) / 60).toString().padStart(2, '0');
                            const secs = (elapsed % 60).toString().padStart(2, '0');
                            const timeStr = hrs > 0 ? `${hrs}:${mins}:${secs} elapsed` : `${mins}:${secs} elapsed`;
                            timeHtml = `<small style="margin-top: 4px; display: block; color: rgba(255, 255, 255, 0.55);">${timeStr}</small>`;
                        }
                    }
                    if (act.type === 4) {
                        const status = act.state || act.name;
                        if (status) {
                            activityHtml += `
                  <div class="other-activity">
                    ${iconHtml}
                    <div class="activity-text">
                      <strong>Status</strong>
                      <small>${status}</small>
                    </div>
                  </div>
                `;
                        }
                    } else {
                        let detailsStr = [act.details, act.state].filter(Boolean).join(' - ');
                        activityHtml += `
                <div class="other-activity">
                  ${iconHtml}
                  <div class="activity-text">
                    <strong>${act.name}</strong>
                    ${detailsStr ? `<small>${detailsStr}</small>` : ''}
                    ${timeHtml}
                  </div>
                </div>
              `;
                    }
                });
            }
            document.getElementById("activity").innerHTML = activityHtml || "No activity right now";
        } catch (e) {
            document.getElementById("activity").textContent = "Failed to load presence";
        }
    }
    document.getElementById('activity').addEventListener('input', (e) => {
        if (e.target.classList.contains('spotify-volume-slider')) {
            const audio = document.getElementById('bg-audio');
            const val = e.target.value;
            audio.volume = val;
        }
    });
    async function updateBackgroundColors(url) {
        const img = new Image();
        img.crossOrigin = "Anonymous";
        img.src = url;
        img.onload = () => {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 3;
            canvas.height = 1;
            ctx.drawImage(img, 0, 0, 3, 1);
            const data = ctx.getImageData(0, 0, 3, 1).data;
            const c1 = `rgba(${data[0]}, ${data[1]}, ${data[2]}, 0.5)`;
            const c2 = `rgba(${data[4]}, ${data[5]}, ${data[6]}, 0.5)`;
            const c3 = `rgba(${data[8]}, ${data[9]}, ${data[10]}, 0.5)`;
            const bg = document.getElementById('bg-glow');
            bg.style.setProperty('--c1', c1);
            bg.style.setProperty('--c2', c2);
            bg.style.setProperty('--c3', c3);
            bg.style.opacity = '0.4';
        };
    }
    fetchLanyard();
    setInterval(fetchLanyard, 1000);
    const vUrl = 'https://hits.sh/doswak.godwaksites.com.svg?style=flat-square&label=v';
    const fetchCount = (url) => {
        fetch(`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`)
            .then(r => r.text())
            .then(svg => {
                const m = svg.match(/aria-label="(?:v|visitors):\s*(\d+)"/i) || svg.match(/<title>(?:v|visitors):\s*(\d+)<\/title>/i) || svg.match(/>( \d+)<\/text>/);
                if (m) {
                    const el = document.getElementById('visitor-num');
                    el.textContent = ': ' + m[1];
                    el.classList.remove('loading-dots');
                } else {
                    throw new Error("Regex failed");
                }
            })
            .catch(() => {
                fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`)
                    .then(r => r.json())
                    .then(d => {
                        const m = d.contents.match(/aria-label="(?:v|visitors):\s*(\d+)"/i) || d.contents.match(/>( \d+)<\/text>/);
                        if (m) {
                            const el = document.getElementById('visitor-num');
                            el.textContent = ': ' + (m[1] || m[0].match(/\d+/)[0]);
                            el.classList.remove('loading-dots');
                        }
                    });
            });
    };
    fetchCount(vUrl);

    const titles = ["DoswAk"];
    let titleIndex = 0;
    let charIndex = 0;
    let typing = true;

    function typeTitle() {
        const currentTitle = titles[titleIndex];

        if (typing) {
            document.title = currentTitle.substring(0, charIndex + 1);
            charIndex++;
            if (charIndex === currentTitle.length) {
                typing = false;
                setTimeout(typeTitle, 1000);
                return;
            }
        } else {
            document.title = currentTitle.substring(0, charIndex - 1);
            charIndex--;
            if (charIndex === 0) {
                typing = true;
                titleIndex = (titleIndex + 1) % titles.length;
            }
        }
        setTimeout(typeTitle, typing ? 100 : 50);
    }

    typeTitle();

</script>
</body>
